# =============================================================================
# blog-api-backend
#
# Two jobs, both load-bearing:
#   1. PEP 621 metadata describing and pinning the FastAPI service distribution.
#   2. The SINGLE SOURCE of the backend's ruff, mypy, pytest and coverage
#      configuration.
#
# Nothing else in the repository configures those tools. There is deliberately
# no pytest.ini, mypy.ini, .mypy.ini, ruff.toml, .ruff.toml, setup.cfg, tox.ini
# or .coveragerc anywhere under backend/, and no pyproject.toml at the
# repository root. Adding any of them would either shadow or compete with this
# file and break the single-source design it exists to provide.
#
# Every blocking backend quality gate is driven from here:
#
#   ruff check backend                                   # lint     (from root)
#   ruff format --check backend                          # format   (from root)
#   cd backend && mypy                                   # types
#   cd backend && pytest --cov=app --cov-fail-under=80   # tests + coverage
#
# The equivalent repository-root spellings used by the plan also work:
#
#   mypy --config-file backend/pyproject.toml backend/app
#   pytest backend/tests --cov=backend/app --cov-fail-under=80
#
# These tools locate their configuration by three DIFFERENT mechanisms, which is
# why a few settings below look redundant and are not:
#   * ruff     walks up the directory tree from each linted file, so a
#              repository-root invocation discovers this file automatically.
#   * pytest   walks up from its command-line arguments, so `pytest backend/tests`
#              discovers this file and sets rootdir to backend/.
#   * mypy     reads configuration from the CURRENT WORKING DIRECTORY ONLY - see
#              the note directly above [tool.mypy].
#   * coverage behaves like mypy, not like pytest - see the note directly above
#              [tool.coverage.run].
#
# Assuming they behave alike is the trap; each is handled explicitly below.
#
# Interpreter: CPython 3.14.7 (backend/.python-version).
# Runtime pins: mirrored verbatim from the DECLARED section of
#               backend/requirements.txt - see below.
# =============================================================================

[build-system]
# EXACT, not a floor. A range here is not reproducible: PEP 517 build isolation
# resolves `requires` against the index at build time, so `setuptools>=80` builds
# this distribution with whatever release exists on the day it runs, and the
# metadata a range produces is therefore a function of the calendar rather than
# of this repository. 83.0.0 is the release actually exercised here on CPython
# 3.14.7 (metadata generation and wheel build both verified), and it is the only
# release this file authorises. Bumping it is a deliberate, re-verified change.
#
# setuptools >= 77 is separately required for the PEP 639 SPDX `license` string
# used below, so the pin must never move backwards past that floor.
#
# `wheel` is deliberately absent - setuptools.build_meta requests it itself when
# one is needed.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-api-backend"
version = "1.0.0"
description = "FastAPI service tier of the blog platform, persisted in PostgreSQL"

# EXACT, not a floor. backend/.python-version pins the interpreter to 3.14.7 and
# backend/requirements.txt is hash-locked to the artifacts that install on that
# exact interpreter, so `>=3.14` would advertise support this repository does not
# actually verify - 3.14.8 or 3.15 would satisfy the range while resolving a
# different artifact set. The three declarations are kept in lockstep:
#   backend/.python-version   3.14.7
#   requires-python           ==3.14.7   (this line)
#   Programming Language ::   3.14       (classifier granularity stops at minor)
requires-python = "==3.14.7"
license = "MIT"
authors = [{ name = "Blitzy Agent", email = "agent@blitzy.com" }]
keywords = ["blog", "fastapi", "postgresql", "rest-api", "sqlalchemy", "jwt"]

# Classifiers describe what this distribution IS. Every entry below is a real
# trove classifier and is true of this code.
#
# There is deliberately no WSGI classifier. This is an ASGI application end to
# end - `FastAPI` subclasses Starlette, every route handler is `async def`, the
# database session is an `AsyncSession`, and gunicorn runs it only through
# `uvicorn.workers.UvicornWorker`. Nothing here implements or is callable through
# the WSGI protocol, so "Topic :: Internet :: WWW/HTTP :: WSGI :: Application"
# was a false statement about the artifact and has been removed rather than
# translated: the trove list has no ASGI counterpart to translate it into
# (verified against the `trove-classifiers` dataset - zero entries contain
# "ASGI"). `Framework :: AsyncIO` and the protocol-neutral Dynamic Content topic
# carry the accurate part of the same intent.
classifiers = [
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    # Not a trove classifier, and that is the point: PyPI rejects any classifier
    # it does not recognise, so this one makes an accidental upload fail. This
    # distribution is built and run in place; it is never published.
    "Private :: Do Not Upload",
]

# `readme` is deliberately OMITTED.
#
# The project's canonical README is the repository-root README.md, one directory
# above this file, and setuptools refuses to read a metadata file from outside
# the project directory. Both spellings fail metadata generation identically:
#
#   readme = "../README.md"
#   readme = {file = "../README.md", content-type = "text/markdown"}
#
#   distutils.errors.DistutilsOptionError:
#       Cannot access '<repo>/backend/../README.md'
#       (or anything outside '<repo>/backend')
#
# Duplicating the README into backend/ purely to satisfy the key would create a
# second document to keep in sync, so the key is dropped instead. `description`
# above carries the summary, and the root README remains the single narrative
# source of truth.

# Runtime dependencies - this array is the DIRECT set: the packages this
# service depends on because its own code or its own operation needs them, every
# one of them mirrored package-for-package and version-for-version from the
# first section of backend/requirements.txt, with every extra intact and every
# pin exact. `==` throughout, never a range: two manifests that disagree are
# worse than one, and a loose specifier here would silently reintroduce the
# unpinned state this project replaced. Change one file and you must change the
# other.
#
# The two files are deliberately not identical, and the difference is one thing:
# requirements.txt carries a second section pinning the 29 transitive
# distributions this set resolves to, so an install reproduces the whole
# environment rather than only the request. That belongs there and not here,
# because this array states what the DISTRIBUTION depends on - a consumer that
# installed this package would have its own resolver and its own lock, and a
# library that pinned its dependencies' dependencies would be unusable inside
# anyone else's. `requirements.txt` is the deployment lock; this array is the
# dependency declaration. When the direct set changes, both change - and the
# closure in requirements.txt has to be regenerated, not edited.
#
# Every package the backend imports is here, including the ones a parent would
# have supplied anyway: `starlette` because three modules import it directly,
# and `pydantic` and `greenlet` for the same reason applied to a runtime need.
# Inheriting a pin from another project's metadata means that project can move
# it, or drop it, on its own release schedule.
dependencies = [
    # Web framework and ASGI server stack
    "fastapi==0.141.1",
    # Starlette is a DIRECT dependency, not merely fastapi's. Three modules
    # import it by name:
    #   app/core/exceptions.py            starlette.exceptions.HTTPException
    #   app/middleware/request_context.py starlette.datastructures.{Headers,
    #                                     MutableHeaders}, starlette.types.
    #                                     {ASGIApp,Message,Receive,Scope,Send}
    #   app/middleware/security_headers.py starlette.datastructures.
    #                                     MutableHeaders, starlette.types.*
    # Both middleware are written against the raw ASGI protocol rather than
    # BaseHTTPMiddleware, so Starlette's type and datastructure API is a
    # first-class part of this project's own contract. Declaring it makes that
    # visible and pins it: without this line the installed Starlette is whatever
    # fastapi's range happens to resolve to on the day of the install, and a
    # release that is compatible with fastapi could still move the
    # `MutableHeaders` or `Message` surface underneath code that reaches for it
    # directly. 1.4.1 is the release fastapi 0.141.1 resolves to here and the one
    # every gate in this repository was verified against; it is also the version
    # backend/requirements.txt locks, hashes included.
    "starlette==1.4.1",
    "uvicorn[standard]==0.52.1",
    "gunicorn==26.0.0",
    # Schema and settings layer
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "python-multipart==0.0.32",
    # Data layer - PostgreSQL 18 through psycopg 3; deliberately no second driver
    "SQLAlchemy==2.0.51",
    "alembic==1.19.0",
    "psycopg[binary]==3.3.4",
    "greenlet==3.5.4",
    # Security
    "PyJWT==2.13.0",
    "pwdlib[argon2]==0.3.0",
    "slowapi==0.1.10",
    "bleach==6.4.0",
    # Utilities and observability
    "python-slugify==8.0.4",
    "structlog==26.1.0",
    "orjson==3.11.9",
]

# `[project.optional-dependencies]` is deliberately absent. The development set
# (pytest, pytest-asyncio, pytest-cov, httpx, Faker, ruff, mypy) is declared in
# backend/requirements-dev.txt and nowhere else, so there is exactly one place
# to update and exactly one thing that can drift.
#   python -m pip install -r requirements-dev.txt

# -----------------------------------------------------------------------------
# Packaging
# -----------------------------------------------------------------------------
# Package discovery is scoped EXPLICITLY rather than left to auto-discovery.
# backend/ holds three sibling top-level directories - app/, migrations/ and
# tests/ - which is exactly the shape that makes setuptools' flat-layout
# heuristic give up:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['app', 'tests', 'migrations'].
#
# `app` is the only importable distribution package; migrations are executed by
# Alembic from the source tree and tests are never shipped.
[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "migrations*"]

# =============================================================================
# ruff - lint and format. Governs `ruff check backend` and
# `ruff format --check backend`, both invoked from the repository root.
# =============================================================================
[tool.ruff]
# 100 columns matches `max_line_length = 100` for *.py in the root
# .editorconfig, and suits the long generic annotations that typed SQLAlchemy
# 2.0 and FastAPI signatures produce.
line-length = 100
indent-width = 4

# Agrees with `requires-python = "==3.14.7"` above; ruff's target granularity is
# minor-version only, so `py314` is the exact translation of that pin. ruff would
# infer the same value, but stating it keeps the target explicit if this table is
# ever read in isolation. Verified accepted by the pinned ruff 0.16.1.
target-version = "py314"

# Roots for first-party import resolution. "." is the backend package root, so
# `import app...` and `import tests...` resolve by path; "app" and "tests" are
# listed as well so a module referenced from inside either tree still resolves.
# `known-first-party` below makes the classification explicit regardless.
src = [".", "app", "tests"]

# ruff's default exclusions already cover .venv/, .git/, __pycache__/, build/
# and dist/, so no extend-exclude is needed. In particular migrations/ is NOT
# excluded: backend/alembic.ini runs `ruff format` and `ruff check --fix` as
# post-write hooks on every generated revision, so revision modules are
# expected to be lint-clean. Their fixed generated shape is accommodated with
# targeted per-file ignores instead of a wholesale exclusion.

[tool.ruff.lint]
# Note for anyone writing generic code here: because `target-version` is py314,
# the `UP` group activates UP046/UP047, which require PEP 695 type-parameter
# syntax - `class Page[ItemT](BaseModel):` and `def build_page[ItemT](...)`,
# not `Generic[ItemT]` with a module-level TypeVar. That form was verified
# end to end against the pinned versions: it constructs and serialises
# correctly under pydantic 2.13.4, generates the expected JSON schema, and
# type-checks clean under strict mypy 2.3.0 with the pydantic plugin.
select = [
    "E",     # pycodestyle errors, including line-too-long
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort - deterministic import ordering
    "N",     # pep8-naming
    "UP",    # pyupgrade - keep syntax current with the pinned interpreter
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async - blocking calls inside async def, and friends
    "S",     # flake8-bandit - security smells
    "PT",    # flake8-pytest-style
    "TID",   # flake8-tidy-imports - absolute imports only
    "PTH",   # flake8-use-pathlib
    "T20",   # flake8-print - stray print(); this service logs through structlog
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
]

# Exactly one rule is switched off globally, and only after seeing it misfire.
ignore = [
    # S105 keys off the *identifier*, not the value: any name containing "token"
    # or "secret" assigned a string literal is reported. In a JWT service that
    # means legitimate, non-sensitive constants such as `TOKEN_TYPE_ACCESS =
    # "access"` and the OAuth2 `token_type: str = "bearer"` response field are
    # all flagged, and suppressing each at its call site would litter the auth
    # modules with noqa comments. The genuine hazards this rule is meant to
    # catch remain covered: S106 (a credential passed as a function argument)
    # and S107 (a credential as a parameter default) both stay ACTIVE, no
    # credential has a literal default anywhere - app/core/config.py requires
    # JWT_SECRET_KEY from the environment with no fallback - and .env files are
    # gitignored, with .env.example carrying placeholders only.
    "S105",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency and parameter markers are evaluated once at import time
# and are safe as default arguments; B008 exists for genuinely mutable defaults.
# Naming them precisely keeps B008 active everywhere else instead of switching
# the rule off wholesale.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports everywhere. Layer boundaries between api/, services/,
# repositories/ and models/ are only reviewable when every import states the
# full path it crosses.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert, fabricate credential-shaped strings, and request fixtures whose
# value is their side effect rather than their return.
"tests/**/*.py" = [
    "S101", # `assert` is how a test states its expectation
    "S106", # fixture credentials are fabricated, not real
    "S107",
    "S311", # non-cryptographic randomness is fine for fixture data
    "ARG001",
    "ARG002",
    "ARG005",
]
# Alembic revisions have a fixed generated shape: module-level `revision` and
# `down_revision` identifiers, long inline DDL literals the formatter cannot
# split, and literal SQL in data migrations.
"migrations/versions/*.py" = [
    "E501", # generated DDL and index expressions exceed the column budget
    "N806",
    "S608", # literal SQL is the entire point of a data migration
]
# Starlette hands `request` to every exception handler positionally, whether or
# not that handler has any use for it.
"app/core/exceptions.py" = ["ARG001"]

[tool.ruff.format]
# Must not contradict the root .editorconfig, which sets `indent_style = space`
# with `indent_size = 4` and `end_of_line = lf` for *.py. Never tab, never crlf.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# =============================================================================
# mypy - static typing.
#
# CONFIG DISCOVERY: unlike ruff, mypy does NOT search upwards. It reads
# mypy.ini, .mypy.ini, pyproject.toml, then setup.cfg from the CURRENT WORKING
# DIRECTORY only. The three canonical, equivalent invocations - each verified to
# exit 0 - are:
#
#   cd backend && mypy                                        # uses `files` below
#   cd backend && mypy app                                    # identical scope
#   mypy --config-file backend/pyproject.toml backend/app     # from the root
#
# A bare `mypy backend/app` from the repository root is NOT equivalent: it finds
# no configuration, runs on mypy's permissive defaults, and fails on the one
# untyped third-party import the overrides below account for
# (`Library stubs not installed for "bleach"  [import-untyped]`). Use one of the
# three forms above.
#
# `files` and `mypy_path` below make the first form completely self-sufficient,
# which is what the root Makefile's `typecheck-backend` target relies on.
# The fix is deliberately NOT a root-level mypy.ini: that would reintroduce the
# competing configuration this file exists to prevent.
#
# Strictness is not decoration. Untyped function bodies and implicit `Any`
# returns are exactly how a layering violation - a route handler reaching for a
# session, a repository importing a service - slips through review unnoticed.
# =============================================================================
[tool.mypy]
python_version = "3.14"
files = ["app"]
mypy_path = ["."]
exclude = ['^\.venv/']

strict = true

# Beyond `strict`, and each one earns its place:
warn_unreachable = true    # a branch typing says can never run is a real defect
show_error_codes = true    # every message carries the code needed to silence it
enable_error_code = [
    "ignore-without-code", # a bare `# type: ignore` must name the code it hides
    "redundant-self",      # an explicit Self annotation that adds nothing
]

# The Pydantic v2 plugin. It teaches mypy how model `__init__` signatures are
# synthesised, which is what makes `[tool.pydantic-mypy]` below effective.
#
# sqlalchemy.ext.mypy.plugin is deliberately NOT enabled. SQLAlchemy 2.0 types
# its declarative API natively through Mapped[] / mapped_column(), and the
# legacy plugin is deprecated - switching it on against 2.0.51 produces errors
# rather than preventing them.
plugins = ["pydantic.mypy"]

# Third-party modules with no inline type information. Audited against the
# pinned dependency set rather than guessed: of the packages application code
# imports, only `bleach` ships no py.typed marker, and mypy reports
# `Library stubs not installed for "bleach"  [import-untyped]` for it. The other
# three are listed because they are the untyped-import candidates in this
# dependency set and the entry is provably inert while they keep shipping
# py.typed; it costs nothing and survives a future release dropping the marker.
# greenlet, gunicorn and python-multipart also lack markers, but no application
# module imports them - they are needed at runtime rather than at type-check time
# - so they are not listed. `starlette` IS imported by application code and does
# ship py.typed, which is why declaring it above added no override here.
[[tool.mypy.overrides]]
module = ["bleach.*", "pwdlib.*", "slowapi.*", "slugify.*"]
ignore_missing_imports = true

# The gate is the application package, so `app/` carries full strictness. Test
# and migration modules are held to a lower bar: fixtures and Alembic's
# generated `upgrade()`/`downgrade()` bodies gain nothing from full annotation.
[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# =============================================================================
# pytest - unit and integration suites.
#
# pytest discovers its inifile by walking up from its arguments, so
# `pytest backend/tests` from the repository root finds this file and reports
# `rootdir: <repo>/backend, configfile: pyproject.toml`. Every path below is
# resolved relative to that rootdir.
# =============================================================================
[tool.pytest.ini_options]
minversion = "9.0"

# LOAD-BEARING. rootdir is backend/, and under the default `prepend` import mode
# nothing puts backend/ itself on sys.path. Without this entry the very first
# `from app.main import app` in tests/conftest.py fails collection with
# `ModuleNotFoundError: No module named 'app'` and the whole suite errors out
# before a single assertion runs.
pythonpath = ["."]

testpaths = ["tests"]

# `--strict-markers` rejects an unregistered marker (see `markers` below) and
# `--strict-config` rejects an unknown or misspelt key in this very table, so a
# typo here fails loudly instead of being silently ignored.
#
# `--cov` is deliberately ABSENT. Coverage is requested on the command line
# (`--cov=app` locally, `--cov=backend/app` from the repository root); adding it
# here as well would layer a second source specification over the first and
# double-count measured lines. The coverage *settings* are centralised in
# [tool.coverage.*] instead.
addopts = "-ra --strict-markers --strict-config"

# pytest-asyncio 1.4.0. `auto` treats every `async def test_*` as a coroutine
# test without a per-test marker.
asyncio_mode = "auto"

# BOTH loop scopes are set, and both are required.
#
# tests/conftest.py builds a SESSION-scoped async engine and layers a
# per-test transaction on top of it. Setting only the fixture scope leaves
# function-scoped async tests on a DIFFERENT event loop from the session-scoped
# fixture that created the engine - verified directly, by comparing
# id(asyncio.get_running_loop()) across the two - and connections created on one
# loop cannot be awaited on another. Raising the test loop scope to `session`
# puts the engine, its connections and every test on one loop for the whole run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

markers = [
    "unit: fast, isolated tests that touch neither the database nor the network",
    "integration: tests that drive the API in-process against PostgreSQL",
]

# Warnings are reported, not fatal: a deprecation emitted by a pinned
# dependency must not turn a green suite red without an accompanying code
# change. `default` prints the first occurrence per location.
filterwarnings = ["default"]

# =============================================================================
# coverage.py - measurement settings for the `--cov-fail-under=80` gate.
#
# CONFIG DISCOVERY: coverage.py behaves like mypy, not like pytest. It reads
# .coveragerc, setup.cfg, tox.ini and pyproject.toml from the CURRENT WORKING
# DIRECTORY only, and does not walk upwards - so pytest can set rootdir to
# backend/ and still hand coverage no configuration at all. Observed directly:
#
#   cd backend && pytest --cov=app --cov-fail-under=80
#       -> reads this table: branch columns, Missing column, 2-dp percentages
#   pytest backend/tests --cov=backend/app --cov-fail-under=80   (from root)
#       -> still passes, but on coverage's own defaults; the tables below are
#          never seen, because the repository root has no pyproject.toml
#
# The root-level form is made fully equivalent by naming the file explicitly:
#
#   pytest backend/tests --cov=backend/app \
#          --cov-config=backend/pyproject.toml --cov-fail-under=80
#
# `--cov-config` is deliberately NOT added to `addopts` above: addopts is a
# single string shared by every invocation, and a relative path in it would
# resolve against whichever directory pytest was launched from - correct for one
# caller and broken for the other. The Makefile's `test-backend` target runs
# from backend/, which is the canonical path and needs no flag.
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true

# The same run is invoked two ways - `--cov=app` from backend/ and
# `--cov=backend/app` from the repository root - and relative paths are what let
# the two spellings produce one comparable report instead of two disjoint ones.
relative_files = true

omit = ["tests/*", "migrations/*"]

[tool.coverage.paths]
# Collapse the two spellings of the same tree onto a single canonical name so a
# report generated from either invocation names the same files.
source = ["app", "backend/app", "*/backend/app"]

[tool.coverage.report]
# Mirrors the `--cov-fail-under=80` supplied on the command line, so the
# threshold has one authoritative home even when the flag is omitted.
fail_under = 80
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    # `exclude_lines` REPLACES coverage's built-in list, so the default pragma
    # has to be restated here.
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
    '^\s*\.\.\.$',
    '@(?:typing\.)?overload',
]

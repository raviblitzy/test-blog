# Alembic configuration.
#
# The database URL is deliberately NOT declared here: `migrations/env.py` reads
# it from the application settings object (app.core.config), so the application
# and the migration runner share a single source of truth.
#
# Usage (from backend/, with .venv active):
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#   alembic downgrade base
#   alembic check

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Revision filenames: 0001_initial_blog_schema.py, 0002_..., in load order.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are timezone-aware UTC.
timezone = UTC

# sqlalchemy.url is intentionally omitted - see the note above.

[post_write_hooks]
# ruff ships a native binary rather than a console_scripts entry point, so the
# hook must be of type `exec` (a console_scripts hook fails with
# "Could not find entrypoint console_scripts.ruff").
hooks = ruff_format,ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

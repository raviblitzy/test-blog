# =============================================================================
# Alembic - migration configuration for the blog service.
#
# This file governs the three blocking schema gates, none of which can run at
# all if it is wrong:
#
#   alembic upgrade head     apply every revision to an empty database
#   alembic downgrade base   prove every revision is reversible
#   alembic check            prove the models and the schema have not drifted
#
# THE CANONICAL WORKING DIRECTORY IS backend/. Both `script_location` and
# `prepend_sys_path` below are resolved against the process working directory,
# so every invocation is made from there. That is what the Makefile does
# (`cd backend && .venv/bin/alembic ...`) and what the container image does.
# Invoked from anywhere else, Alembic stops at once with
# `Path doesn't exist: migrations` - a loud, immediately diagnosable failure,
# deliberately preferred over a half-resolved configuration. It is the same
# rule that makes `uvicorn app.main:app` from backend/ the canonical way to
# serve the application rather than the deprecated repository-root shim.
#
# So, from backend/, with the project's virtual environment supplying alembic:
#
#   alembic revision --autogenerate -m "message"   author a new revision
#
# or from the repository root, which does the cd for you:
#
#   make migrate | make migration m="message" | make downgrade
#
# THERE IS DELIBERATELY NO `sqlalchemy.url` KEY HERE. The [alembic] section
# below records why; the omission is a requirement, not an oversight.
#
# Tool settings live elsewhere on purpose. pyproject.toml is the single source
# of the ruff, mypy, pytest and coverage configuration, and all this file does
# is point ruff at each newly generated revision.
# =============================================================================

[alembic]
# The revision tree, relative to the working directory described above:
# backend/migrations, holding env.py, script.py.mako and versions/.
#
# `version_locations` is deliberately not set. There is exactly one version
# directory, migrations/versions, and the revisions in it are intentionally
# separate steps - the initial schema, then the search column and its indexes,
# then the reference data - so nothing here may collapse or re-order them.
script_location = migrations

# LOAD-BEARING. Alembic executes `sys.path[:0] = [<this value>]`, which places
# the backend root - the directory that holds app/ - on the import path.
# migrations/env.py needs it to reach `app.db.base` for `Base.metadata` and
# `app.models` so that autogeneration sees every mapped class, and
# `app.core.config` for the connection URL. Without it every Alembic command
# fails with `ModuleNotFoundError: No module named 'app'` before it opens a
# connection, which takes all three gates above down with it. This is the exact
# counterpart of `pythonpath = ["."]` in pyproject.toml's
# [tool.pytest.ini_options], and it is here for the same reason.
prepend_sys_path = .

# The character that splits the path lists above; `os` means os.pathsep.
# Deliberately `path_separator`, NOT the older `version_path_separator`: on
# alembic 1.19.0 the legacy key warns "The version_path_separator configuration
# parameter is deprecated; please use path_separator", and omitting both warns
# again about "falling back to legacy splitting on spaces/commas". Setting this
# one key is what keeps the migration commands warning-free.
path_separator = os

# Revision filenames are `<rev>_<slug>.py`, which is what gives the ordered,
# self-describing names 0001_initial_blog_schema.py,
# 0002_post_search_vector_and_indexes.py, 0003_seed_reference_categories.py.
#
# The doubled `%%` is required. Alembic reads the [alembic] section through
# configparser WITH interpolation enabled, so a literal percent must be
# escaped; a bare `%(rev)s` here aborts every command at config-load time with
# an InterpolationSyntaxError that names no obvious cause. (Contrast
# [formatter_generic] at the end of this file, which is read raw and therefore
# takes single percents.)
file_template = %%(rev)s_%%(slug)s

# Render the timestamps inside a generated revision as UTC, consistent with the
# `timestamptz` columns the schema uses throughout. Left blank this would mean
# localtime, making a revision's contents depend on where it was generated.
timezone = UTC

# --- Connection URL: intentionally ABSENT ------------------------------------
# `sqlalchemy.url` is the key Alembic's stock template ships with a hard-coded
# value. It is absent here, and that absence is the design: migrations/env.py
# takes the URL from `app.core.config.settings`, which reads DATABASE_URL from
# the environment. One settings object therefore serves both the application
# and the migration runner, so the two can never disagree about which database
# they are pointed at. `.env.example` documents the variable and `.gitignore`
# keeps real values out of the repository.
#
# The key is omitted entirely rather than declared empty on purpose: an empty
# value still reaches engine_from_config and fails obscurely there, whereas an
# absent one is unambiguous. Nothing resembling a connection string, a host or
# an account belongs in this file in any form - not as a value, not as a
# default, and not as an example.
# ----------------------------------------------------------------------------

[post_write_hooks]
# Every generated revision is formatted and import-sorted in place, because
# `ruff format --check backend` and `ruff check backend` are blocking gates and
# migrations/ is deliberately not excluded from either (see [tool.ruff] in
# pyproject.toml). Autogenerated revisions are not formatter-clean as emitted,
# so without these hooks the first `alembic revision --autogenerate` would
# break the build. Format first, then lint, so the fixer sees final layout.
hooks = ruff_format,ruff_lint

# `module` - not `exec`, and not `console_scripts`. The module runner invokes
# `sys.executable -m ruff`, i.e. the very interpreter already running Alembic,
# so it always resolves the ruff pinned in this project's virtual environment
# and depends on PATH not at all. That distinction is load-bearing rather than
# stylistic: the Makefile calls `.venv/bin/alembic` by absolute path without
# activating the environment, so `.venv/bin` is NOT on PATH and an `exec` hook
# declaring `executable = ruff` fails with FileNotFoundError. A
# `console_scripts` hook fails as well, because ruff ships a native binary and
# publishes no console_scripts entry point, leaving Alembic to report
# "Could not find entrypoint console_scripts.ruff".
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

# =============================================================================
# Logging is NOT configured here.
#
# Alembic's generated template ends with [loggers], [handlers] and [formatters]
# stanzas that migrations/env.py feeds to logging.config.fileConfig(). This file
# carries none of them, and env.py never calls fileConfig, on purpose:
# app.core.logging.configure_logging() owns the log shape for this project, and
# env.py calls it instead.
#
# What that buys. `alembic upgrade head` inside a container at
# ENVIRONMENT=production emits its `Running upgrade 0002 -> 0003` lines as JSON
# objects through the same processor chain as the service, so the record of which
# revisions were applied is machine-readable alongside everything else the image
# logs - where a fileConfig handler would make those specific lines the only
# plain text in an otherwise structured stream. Under
# ENVIRONMENT=development the same lines are human-readable, for the same reason
# the application's are. LOG_LEVEL sets the threshold, and the SQLAlchemy
# namespace is held at WARNING unless it is DEBUG, so `upgrade head` reports
# revision progress rather than pages of DDL.
#
# Declaring the stanzas anyway would not be harmless documentation. Either they
# sit unused - configuration that describes nothing, which the next reader has to
# discover is inert - or someone reinstates the fileConfig call and the root
# logger ends up with two handlers, rendering every line twice: once as plain
# text and once as JSON.
# =============================================================================

# Local development infrastructure.
#
# Today this file provisions the PostgreSQL 18 system of record, which is the
# only piece of infrastructure the application needs in order to run.
# The `backend` and `frontend` services described by the Agent Action Plan
# (section 0.7.1.12) are added alongside `backend/Dockerfile` and
# `frontend/Dockerfile` when those images are introduced.
#
# Usage:
#   docker compose up -d db          # start PostgreSQL 18.4
#   docker compose ps                # check health
#   docker compose logs -f db        # follow logs
#   docker compose down              # stop (keeps the named volume)
#   docker compose down -v           # stop and delete data
#
# Parallel clones: export COMPOSE_PROJECT_NAME and POSTGRES_PORT (for example
# POSTGRES_PORT=$((5432 + CLONE_INDEX))) so concurrent workspaces do not
# collide on the container name, the volume or the published port.

name: ${COMPOSE_PROJECT_NAME:-blog}

services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      # Deterministic collation for citext / full-text search behaviour.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a major-version subdirectory, so the
      # volume must be mounted at /var/lib/postgresql (NOT .../data).
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db_data:
